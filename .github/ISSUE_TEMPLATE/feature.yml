name: Feature proposal
description: Propose a focused improvement and explain its privacy impact.
title: "[Proposal]: "
labels: [enhancement]
body:
  - type: textarea
    id: benefit
    attributes:
      label: User benefit
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Suggested approach
  - type: textarea
    id: charter
    attributes:
      label: Charter and mastery alignment
      description: Name the north-star principle and Path to Mastery node this proposal advances.
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Does this introduce network or cloud behavior?
      options: [No, Maybe, Yes]
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy, storage, model and cost implications
    validations:
      required: true
