name: Bug report
description: Report a reproducible Rangabot problem without private data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never attach personal chats, `.env.local`, vault documents, databases or embeddings.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and safe reproduction steps.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, Ollama version and model name.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Safe doctor output
      description: Paste non-sensitive output from npm run doctor.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed personal data, credentials and private Knowledge Vault content.
          required: true
