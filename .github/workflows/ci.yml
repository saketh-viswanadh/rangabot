name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - run: npm ci
      - run: npm ci --prefix website
      - name: Enforce official mastery approval
        run: node --experimental-strip-types scripts/check-mastery-governance.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run check
      - run: npm audit --omit=dev
      - run: npm test --prefix website
      - run: npm run lint --prefix website
      - run: npm audit --omit=dev --prefix website
